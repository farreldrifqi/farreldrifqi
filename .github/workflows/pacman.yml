name: Generate Pacman Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *" # Otomatis berjalan setiap hari
  workflow_dispatch:     # Memungkinkan dijalankan manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Pacman Animation
        uses: subha-r-k/pacman-contributions@master
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Push Pacman SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
